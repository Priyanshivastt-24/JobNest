<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign In')}"></head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="main-content">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Welcome to JobNest</h2>
                    <p>Enter your credentials to access your dashboard</p>
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="loginEmail" name="email" class="form-control" placeholder="name@company.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; margin-top: 10px;">
                        Sign In
                    </button>
                </form>

                <div style="text-align: center; margin-top: 24px; font-size: 0.92rem; color: var(--text-secondary);">
                    Don't have an account?
                    <a th:href="@{/register}" style="color: var(--secondary); font-weight: 700;">Create one now</a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
