# ─────────────────────────────────────────────────────────────────
# JobNest – Spring Boot Application Configuration
# Tech Stack: Java, Spring Boot, Spring MVC, Spring Data JPA,
#             MySQL, HTML, CSS, JavaScript, and Thymeleaf
# ─────────────────────────────────────────────────────────────────

spring.application.name=jobnest-backend
server.port=5000

# ── MySQL Database Configuration ─────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobnest_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate Settings ────────────────────────────────────
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ── Thymeleaf Template Configuration ─────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ── Static Web Resources ─────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ── Security & JWT Configuration ────────────────────────────────
jobnest.jwt.secret=jobnest-super-secret-key-2026-spring-boot-mysql-jwt-token-auth
jobnest.jwt.expiration=604800000

# ── CORS Settings ────────────────────────────────────────────────
jobnest.cors.allowed-origins=http://localhost:5173,http://localhost:4173,http://localhost:3000
